<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ozzie — Live Demo</title>
<link rel="icon" type="image/svg+xml" href="ozzie-logo.svg?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0b0a08;
    font-family:'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color:#f3f1ea;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 40px;
  }
  .top {
    width:100%; max-width:900px;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:20px;
  }
  .top h1 { font-family:'Fraunces', Georgia, serif; font-size:21px; font-weight:600; letter-spacing:-0.01em; }
  .top h1 em { font-style:italic; color:#3ecf7e; font-weight:500; }
  .badge {
    font-size:11px; font-weight:700; letter-spacing:0.08em;
    padding:5px 10px; border-radius:20px;
  }
  .badge.demo { background:#1b1a13; color:#a39d8c; border:1px solid #28261c; }
  .badge.ai   { background:#0f3d24; color:#3ecf7e; border:1px solid #1e5535; }
  .controls { width:100%; max-width:900px; display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; align-items:center; }
  .chip {
    background:#16150f; border:1px solid #28261c; color:#d8d4c6;
    padding:9px 16px; border-radius:24px; font-size:13px; cursor:pointer;
    transition:all .15s;
  }
  .chip:hover { border-color:#3a3626; }
  .chip.on { background:#e8a23a; border-color:#e8a23a; color:#062112; font-weight:600; }
  .lang { margin-left:auto; display:flex; gap:4px; }
  .lang .chip { padding:7px 12px; font-size:12px; }

  /* ─── Phone ─── */
  .phone {
    width:380px; max-width:100%;
    background:#111; border:1px solid #2a2a2a; border-radius:36px;
    padding:10px; box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  .screen { border-radius:28px; overflow:hidden; display:flex; flex-direction:column; height:640px; background:#ECE5DD; }

  .wa-header {
    background:#075E54; color:#fff; padding:12px 14px;
    display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .avatar {
    width:38px; height:38px; border-radius:50%; background:#128C7E;
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .wa-header .info { line-height:1.25; }
  .wa-header .name { font-size:15px; font-weight:600; }
  .wa-header .status { font-size:11.5px; color:#c8e6e2; }

  .msgs {
    flex:1; overflow-y:auto; padding:14px 12px;
    background:#ECE5DD;
    background-image:radial-gradient(circle at 20% 30%, rgba(0,0,0,0.02) 0%, transparent 50%),
                     radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0%, transparent 50%);
    display:flex; flex-direction:column; gap:6px;
  }
  .msg {
    max-width:78%; padding:8px 11px; border-radius:9px;
    font-size:13.5px; line-height:1.42; color:#111;
    box-shadow:0 1px 1px rgba(0,0,0,.08);
    white-space:pre-wrap; word-wrap:break-word;
    position:relative; animation:pop .18s ease;
  }
  @keyframes pop { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none; } }
  .msg.biz  { background:#fff; align-self:flex-start; border-top-left-radius:2px; }
  .msg.user { background:#DCF8C6; align-self:flex-end; border-top-right-radius:2px; }
  .msg .time { display:block; font-size:10px; color:#999; text-align:right; margin-top:3px; }

  .booking {
    align-self:flex-start; background:#fff; border-left:4px solid #25D366;
    border-radius:9px; padding:10px 14px; max-width:82%;
    box-shadow:0 1px 2px rgba(0,0,0,.1); color:#111; animation:pop .18s ease;
  }
  .booking .bk-title { font-size:13px; font-weight:700; color:#128C7E; margin-bottom:5px; }
  .booking .bk-row { font-size:12.5px; padding:1.5px 0; color:#333; }
  .booking .bk-row b { color:#111; }

  .typing { align-self:flex-start; background:#fff; border-radius:9px; padding:12px 16px; box-shadow:0 1px 1px rgba(0,0,0,.08); }
  .typing span {
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:#bbb; margin:0 1.5px; animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){ animation-delay:.2s; }
  .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink { 0%,60%,100% { opacity:.3; } 30% { opacity:1; } }

  .quick { display:flex; gap:6px; padding:8px 10px 4px; background:#ECE5DD; flex-wrap:wrap; }
  .qchip {
    background:#fff; border:1px solid #d0d0d0; color:#075E54;
    font-size:12px; font-weight:600; padding:6px 12px; border-radius:16px; cursor:pointer;
  }
  .qchip:active { background:#e8f5f3; }

  .inputbar { display:flex; gap:8px; padding:8px 10px 10px; background:#ECE5DD; flex-shrink:0; }
  .inputbar input {
    flex:1; border:none; border-radius:22px; padding:11px 16px;
    font-size:14px; outline:none; background:#fff; color:#111;
  }
  .send {
    width:44px; height:44px; border-radius:50%; border:none;
    background:#25D366; color:#fff; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .foot { margin-top:18px; font-size:12px; color:#555; text-align:center; max-width:380px; line-height:1.5; }
  .foot b { color:#888; }
</style>
</head>
<body>

<div class="top">
  <h1>Ozzie <em>— Demo</em></h1>
  <div class="badge demo" id="badge">DEMO MODE</div>
</div>

<div class="controls">
  <button class="chip on" data-biz="barber">💈 <span class="blabel">Barbershop</span></button>
  <button class="chip" data-biz="resto">🍽️ <span class="blabel">Restaurant</span></button>
  <button class="chip" data-biz="dental">🦷 <span class="blabel">Dental clinic</span></button>
  <div class="lang">
    <button class="chip" data-lang="es">ES</button>
    <button class="chip on" data-lang="en">EN</button>
  </div>
</div>

<div class="phone">
  <div class="screen">
    <div class="wa-header">
      <div class="avatar" id="hAvatar">💈</div>
      <div class="info">
        <div class="name" id="hName">North Van Barbers</div>
        <div class="status" id="hStatus">online</div>
      </div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="quick" id="quick"></div>
    <div class="inputbar">
      <input id="input" type="text" placeholder="Type as if you were the customer…" autocomplete="off">
      <button class="send" id="send">➤</button>
    </div>
  </div>
</div>

<div class="foot" id="foot">
  The business does nothing: the AI replies on its own, 24/7, in any language.<br>
  <b>Type what a real customer would write.</b>
</div>

<script>
// ═══════════════ DATA ═══════════════
const BIZ = {
  barber: {
    avatar:'💈', name:'North Van Barbers',
    facts: {
      hours:  { es:'Abrimos de lunes a sábado, 9:00 a 19:00. Domingos cerrado.', en:'We\'re open Monday to Saturday, 9am to 7pm. Closed Sundays.' },
      prices: { es:'Corte $35 · Corte + barba $50 · Afeitado clásico $30 · Niños $25.', en:'Haircut $35 · Haircut + beard $50 · Classic shave $30 · Kids $25.' },
      where:  { es:'Estamos en 123 Lonsdale Ave, North Vancouver. A 2 min del Quay.', en:'We\'re at 123 Lonsdale Ave, North Vancouver. 2 min from the Quay.' }
    },
    bookLabel: { es:'Reservar cita', en:'Book appointment' },
    steps: [
      { key:'service', q:{ es:'¡Genial! ¿Qué servicio quieres? (corte, corte + barba, afeitado)', en:'Great! Which service would you like? (haircut, haircut + beard, shave)' } },
      { key:'when',    q:{ es:'Perfecto. ¿Qué día y hora te va bien?', en:'Perfect. What day and time works for you?' } },
      { key:'name',    q:{ es:'Última cosa: ¿a nombre de quién pongo la cita?', en:'Last thing: what name should I put the appointment under?' } }
    ],
    labels: { service:{es:'Servicio',en:'Service'}, when:{es:'Día y hora',en:'Date & time'}, name:{es:'Nombre',en:'Name'} }
  },
  resto: {
    avatar:'🍽️', name:'La Costa Restaurant',
    facts: {
      hours:  { es:'Abrimos todos los días de 11:30 a 22:00. Cocina cierra a las 21:30.', en:'Open every day 11:30am to 10pm. Kitchen closes at 9:30pm.' },
      prices: { es:'Platos principales $18-$34. Menú de mediodía $19 (entre semana). Tenemos patio 🌿', en:'Mains $18-$34. Weekday lunch menu $19. We have a patio 🌿' },
      where:  { es:'Estamos en 456 Granville St, Vancouver. Cerca de Waterfront Station.', en:'We\'re at 456 Granville St, Vancouver. Near Waterfront Station.' }
    },
    bookLabel: { es:'Reservar mesa', en:'Book a table' },
    steps: [
      { key:'service', q:{ es:'¡Claro! ¿Mesa para cuántas personas?', en:'Of course! Table for how many people?' } },
      { key:'when',    q:{ es:'Perfecto. ¿Qué día y a qué hora?', en:'Perfect. What day and time?' } },
      { key:'name',    q:{ es:'¿A nombre de quién pongo la reserva?', en:'What name should I put the reservation under?' } }
    ],
    labels: { service:{es:'Personas',en:'Guests'}, when:{es:'Día y hora',en:'Date & time'}, name:{es:'Nombre',en:'Name'} }
  },
  dental: {
    avatar:'🦷', name:'Kits Dental Clinic',
    facts: {
      hours:  { es:'Lunes a viernes de 8:00 a 17:00. Urgencias: te encajamos el mismo día si es posible.', en:'Monday to Friday, 8am to 5pm. Emergencies: we\'ll fit you in same-day when possible.' },
      prices: { es:'Limpieza desde $150 · Revisión + rayos X $120 · Aceptamos la mayoría de seguros.', en:'Cleaning from $150 · Check-up + X-rays $120 · We accept most insurance plans.' },
      where:  { es:'Estamos en 789 W 4th Ave, Kitsilano, Vancouver. Parking gratuito detrás.', en:'We\'re at 789 W 4th Ave, Kitsilano, Vancouver. Free parking in the back.' }
    },
    bookLabel: { es:'Pedir cita', en:'Book appointment' },
    steps: [
      { key:'service', q:{ es:'Claro. ¿Qué necesitas? (limpieza, revisión, urgencia)', en:'Sure. What do you need? (cleaning, check-up, emergency)' } },
      { key:'when',    q:{ es:'¿Qué día y hora te viene mejor?', en:'What day and time works best for you?' } },
      { key:'name',    q:{ es:'¿A nombre de quién pongo la cita?', en:'What name should I put the appointment under?' } }
    ],
    labels: { service:{es:'Motivo',en:'Reason'}, when:{es:'Día y hora',en:'Date & time'}, name:{es:'Nombre',en:'Name'} }
  }
};

const TXT = {
  welcome: {
    es: n => `¡Hola! Gracias por escribir a ${n} 👋 ¿En qué te podemos ayudar?`,
    en: n => `Hey! Thanks for messaging ${n} 👋 How can we help?`
  },
  confirmed: { es:'✅ ¡Listo! Reserva confirmada. Te esperamos 😊', en:'✅ Done! Your booking is confirmed. See you soon 😊' },
  bkTitle:   { es:'Reserva confirmada', en:'Booking confirmed' },
  human:     { es:'Te paso con el equipo, te escriben en cuanto puedan 🙂 Mientras, puedo ayudarte con horarios, precios o reservas.', en:'I\'ll pass you to the team, they\'ll reply as soon as they can 🙂 Meanwhile, I can help with hours, prices or bookings.' },
  fallback:  { es:'Te podemos ayudar con horarios, precios, dónde estamos o reservarte al momento. ¿Qué necesitas?', en:'We can help with hours, prices, where to find us, or get you booked in. What do you need?' },
  thanks:    { es:'¡A ti! 😊 Aquí estoy si necesitas algo más.', en:'You\'re welcome! 😊 I\'m here if you need anything else.' },
  chips: {
    hours:  { es:'Horario', en:'Hours' },
    prices: { es:'Precios', en:'Prices' }
  },
  placeholder: { es:'Escribe como si fueras el cliente…', en:'Type as if you were the customer…' },
  bizNames: {
    barber: { es:'Barbería', en:'Barbershop' },
    resto:  { es:'Restaurante', en:'Restaurant' },
    dental: { es:'Clínica dental', en:'Dental clinic' }
  },
  foot: {
    es:'El negocio no toca nada: la IA responde sola, 24/7, en cualquier idioma.<br><b>Escribe lo que escribiría un cliente real.</b>',
    en:'The business does nothing: the AI replies on its own, 24/7, in any language.<br><b>Type what a real customer would write.</b>'
  }
};

// ═══════════════ STATE ═══════════════
let biz = 'barber';
let lang = 'en';
let aiMode = false;
let flow = null;            // { step: 0, data: {} }
let history = [];           // for AI mode
let busy = false;

const $msgs = document.getElementById('msgs');
const $input = document.getElementById('input');

// ═══════════════ UI ═══════════════
function timeNow() {
  const d = new Date();
  return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
}
function addMsg(text, who) {
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.innerHTML = escapeHtml(text) + '<span class="time">' + timeNow() + (who==='user' ? ' ✓✓' : '') + '</span>';
  $msgs.appendChild(el);
  $msgs.scrollTop = $msgs.scrollHeight;
}
function addBookingCard(data) {
  const b = BIZ[biz];
  const el = document.createElement('div');
  el.className = 'booking';
  el.innerHTML = '<div class="bk-title">✅ ' + TXT.bkTitle[lang] + ' — ' + b.name + '</div>' +
    Object.keys(data).map(k =>
      '<div class="bk-row"><b>' + (b.labels[k] ? b.labels[k][lang] : k) + ':</b> ' + escapeHtml(data[k]) + '</div>'
    ).join('');
  $msgs.appendChild(el);
  $msgs.scrollTop = $msgs.scrollHeight;
}
function showTyping() {
  const el = document.createElement('div');
  el.className = 'typing'; el.id = 'typing';
  el.innerHTML = '<span></span><span></span><span></span>';
  $msgs.appendChild(el);
  $msgs.scrollTop = $msgs.scrollHeight;
}
function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderQuick() {
  const b = BIZ[biz];
  document.getElementById('quick').innerHTML =
    ['<button class="qchip" data-q="hours">'  + TXT.chips.hours[lang]  + '</button>',
     '<button class="qchip" data-q="prices">' + TXT.chips.prices[lang] + '</button>',
     '<button class="qchip" data-q="book">'   + b.bookLabel[lang]      + '</button>'].join('');
}

function renderChrome() {
  document.querySelectorAll('[data-biz]').forEach(el => {
    const lbl = el.querySelector('.blabel');
    if (lbl) lbl.textContent = TXT.bizNames[el.dataset.biz][lang];
  });
  document.getElementById('foot').innerHTML = TXT.foot[lang];
}

function resetChat() {
  flow = null; history = []; busy = false;
  renderChrome();
  const b = BIZ[biz];
  document.getElementById('hAvatar').textContent = b.avatar;
  document.getElementById('hName').textContent = b.name;
  $input.placeholder = TXT.placeholder[lang];
  $msgs.innerHTML = '';
  renderQuick();
  setTimeout(() => {
    const w = TXT.welcome[lang](b.name);
    addMsg(w, 'biz');
    history.push({ role:'assistant', content: w });
  }, 300);
}

// ═══════════════ DEMO ENGINE (works offline, no AI) ═══════════════
function norm(s) {
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}
function detectIntent(t) {
  if (/\b(reserv|cita|book|appoint|table|mesa|turno|schedul|hueco)/.test(t)) return 'book';
  if (/\b(horari|hora abr|abier|abren|cierr|open|hour|close|when.*open)/.test(t)) return 'hours';
  if (/\b(precio|cuanto|cuesta|tarifa|price|cost|how much|menu|servicio|service|rate)/.test(t)) return 'prices';
  if (/\b(donde|direccion|ubicad|address|where|located|location|llegar)/.test(t)) return 'where';
  if (/\b(gracias|thank)/.test(t)) return 'thanks';
  if (/\b(humano|persona real|human|real person|agent)/.test(t)) return 'human';
  if (/\b(hola|hello|hi\b|hey|buenas|good morning|good afternoon)/.test(t)) return 'greet';
  return null;
}
function demoReply(raw) {
  const t = norm(raw);
  const b = BIZ[biz];
  const out = [];

  // Mid-booking: strong intents interrupt, anything else is the answer
  if (flow) {
    const intent = detectIntent(t);
    if (intent && intent !== 'book' && intent !== 'greet' && intent !== 'thanks') {
      out.push(b.facts[intent === 'human' ? 'hours' : intent] ? b.facts[intent][lang] : TXT.fallback[lang]);
      out.push(b.steps[flow.step].q[lang]); // re-ask
      return out;
    }
    flow.data[b.steps[flow.step].key] = raw.trim();
    flow.step++;
    if (flow.step < b.steps.length) {
      out.push(b.steps[flow.step].q[lang]);
    } else {
      out.push({ card: flow.data });
      out.push(TXT.confirmed[lang]);
      flow = null;
    }
    return out;
  }

  const intent = detectIntent(t);
  switch (intent) {
    case 'book':
      flow = { step: 0, data: {} };
      out.push(b.steps[0].q[lang]);
      break;
    case 'hours':  out.push(b.facts.hours[lang]); break;
    case 'prices': out.push(b.facts.prices[lang]); break;
    case 'where':  out.push(b.facts.where[lang]); break;
    case 'thanks': out.push(TXT.thanks[lang]); break;
    case 'human':  out.push(TXT.human[lang]); break;
    case 'greet':  out.push(TXT.welcome[lang](b.name)); break;
    default:       out.push(TXT.fallback[lang]);
  }
  return out;
}

// ═══════════════ AI MODE ═══════════════
async function aiReply(raw) {
  history.push({ role:'user', content: raw });
  const res = await fetch('/api/chat', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ business: biz, lang, messages: history.slice(-14) })
  });
  if (!res.ok) throw new Error('api');
  const j = await res.json();
  let text = j.text || '';
  history.push({ role:'assistant', content: text });

  // Extract booking marker: BOOKING_CONFIRMED|service|when|name
  const out = [];
  const m = text.match(/BOOKING_CONFIRMED\|([^|\n]*)\|([^|\n]*)\|([^|\n]*)/);
  if (m) {
    text = text.replace(m[0], '').trim();
    if (text) out.push(text);
    out.push({ card: { service: m[1].trim(), when: m[2].trim(), name: m[3].trim() } });
  } else if (text) {
    out.push(text);
  }
  return out;
}

// ═══════════════ SEND ═══════════════
async function send(raw) {
  raw = (raw || $input.value).trim();
  if (!raw || busy) return;
  busy = true;
  $input.value = '';
  addMsg(raw, 'user');

  showTyping();
  try {
    let replies;
    if (aiMode) {
      try { replies = await aiReply(raw); }
      catch(e) { replies = demoReply(raw); }   // AI fails → fallback keeps demo alive
    } else {
      await new Promise(r => setTimeout(r, 700 + Math.random() * 800)); // realistic typing
      replies = demoReply(raw);
    }
    hideTyping();
    for (const r of replies) {
      if (typeof r === 'object' && r.card) addBookingCard(r.card);
      else { addMsg(r, 'biz'); if (!aiMode) history.push({ role:'assistant', content: r }); }
      await new Promise(r2 => setTimeout(r2, 350));
    }
  } finally {
    hideTyping();
    busy = false;
    $input.focus();
  }
}

// ═══════════════ EVENTS ═══════════════
document.getElementById('send').onclick = () => send();
$input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

document.querySelectorAll('[data-biz]').forEach(el => {
  el.onclick = () => {
    document.querySelectorAll('[data-biz]').forEach(x => x.classList.remove('on'));
    el.classList.add('on');
    biz = el.dataset.biz;
    resetChat();
  };
});
document.querySelectorAll('[data-lang]').forEach(el => {
  el.onclick = () => {
    document.querySelectorAll('[data-lang]').forEach(x => x.classList.remove('on'));
    el.classList.add('on');
    lang = el.dataset.lang;
    resetChat();
  };
});
document.getElementById('quick').addEventListener('click', e => {
  const q = e.target.dataset && e.target.dataset.q;
  if (!q) return;
  const b = BIZ[biz];
  if (q === 'book') send(b.bookLabel[lang]);
  else send(TXT.chips[q][lang]);
});

// ═══════════════ INIT ═══════════════
(async function init() {
  if (location.protocol !== 'file:') {
    try {
      const r = await fetch('/api/status');
      const j = await r.json();
      if (j.ai) {
        aiMode = true;
        const badge = document.getElementById('badge');
        badge.className = 'badge ai';
        badge.textContent = 'LIVE — CONNECTED';
      }
    } catch(e) {}
  }
  resetChat();
})();
</script>
</body>
</html>
