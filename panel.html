<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ozzie — Panel</title>
<link rel="icon" type="image/svg+xml" href="ozzie-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0b0a08; --card:#16150f; --card2:#1b1a13; --line:#28261c;
    --green:#3ecf7e; --text:#f3f1ea; --dim:#a39d8c; --dim2:#726c5c;
    --serif:'Fraunces', Georgia, serif; --sans:'Inter', -apple-system, sans-serif;
  }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; }
  a { color:inherit; }
  .brand { font-family:var(--serif); font-size:22px; font-weight:600; }
  .brand .dot { color:var(--green); }

  /* login */
  #login { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  #login form { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:36px; width:320px; text-align:center; }
  #login input { width:100%; margin-top:20px; padding:12px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card2); color:var(--text); font-size:15px; }
  #login button { width:100%; margin-top:14px; padding:12px; border:none; border-radius:8px; background:var(--green); color:#062112; font-weight:700; font-size:15px; cursor:pointer; }
  #login .err { color:#e8776a; font-size:13px; margin-top:10px; min-height:16px; }

  /* app */
  #app { display:none; height:100vh; }
  header { display:flex; align-items:center; justify-content:space-between; padding:16px 32px; border-bottom:1px solid var(--line); gap:16px; background:var(--card); }
  .headerBtn { background:var(--card2); border:1px solid var(--line); color:var(--text); padding:8px 16px; border-radius:8px; font-size:13px; cursor:pointer; font-family:var(--sans); }
  .headerBtn:hover { border-color:var(--green); }
  #clientsModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:10; }
  #clientsModal .box { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; width:480px; max-height:80vh; overflow-y:auto; }
  #clientsModal h3 { font-family:var(--serif); font-weight:600; margin-bottom:16px; }
  #clientsModal .biz-row { padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; }
  #clientsModal .biz-row b { font-size:14px; }
  #clientsModal .biz-row .num { color:var(--dim2); }
  #clientsModal input, #clientsModal textarea { width:100%; margin-top:10px; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card2); color:var(--text); font-size:14px; font-family:var(--sans); }
  #clientsModal textarea { min-height:80px; resize:vertical; }
  #clientsModal .row2 { display:flex; gap:10px; }
  #clientsModal button.save { margin-top:14px; width:100%; padding:11px; border:none; border-radius:8px; background:var(--green); color:#062112; font-weight:700; cursor:pointer; }
  #clientsModal .close { float:right; cursor:pointer; color:var(--dim2); }
  #clientsModal .formErr { color:#e8776a; font-size:12px; margin-top:8px; min-height:14px; }
  .layout { display:flex; height:calc(100vh - 57px); max-width:1280px; margin:0 auto; border-left:1px solid var(--line); border-right:1px solid var(--line); }
  #list { width:340px; border-right:1px solid var(--line); overflow-y:auto; flex-shrink:0; background:var(--card); }
  #list .listEmpty { color:var(--dim2); text-align:center; margin-top:60px; padding:0 20px; font-size:13px; }
  .conv { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); cursor:pointer; }
  .conv:hover { background:var(--card2); }
  .conv.active { background:var(--card2); box-shadow:inset 3px 0 0 var(--green); }
  .conv .avatar { width:38px; height:38px; border-radius:50%; background:var(--green); color:#062112; font-family:var(--serif); font-weight:600; font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .conv .meta { min-width:0; }
  .conv .who { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conv .biz { color:var(--dim2); font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conv .off { color:#e8a23a; font-size:11px; margin-top:4px; }
  #thread { flex:1; display:flex; flex-direction:column; min-width:0; background:var(--bg); }
  #thread-head { padding:16px 28px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:var(--card); }
  #msgs { flex:1; overflow-y:auto; padding:28px 32px; display:flex; flex-direction:column; gap:12px; max-width:760px; width:100%; margin:0 auto; }
  .msg { max-width:72%; padding:11px 16px; border-radius:16px; font-size:14.5px; line-height:1.45; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .msg.user { align-self:flex-start; background:var(--card2); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg.assistant { align-self:flex-end; background:var(--green); color:#062112; border-bottom-right-radius:4px; }
  .empty { color:var(--dim2); text-align:center; margin-top:80px; }
  .toggle { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); }
  .toggle input { width:36px; height:20px; }
</style>
</head>
<body>

<div id="login">
  <form onsubmit="return doLogin(event)">
    <div class="brand">ozzie<span class="dot">.</span></div>
    <div style="color:var(--dim);font-size:13px;margin-top:6px;">Client panel</div>
    <input id="tokenInput" type="password" placeholder="Access token" autofocus>
    <button type="submit">Enter</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app">
  <header>
    <div class="brand">ozzie<span class="dot">.</span> <span style="font-family:var(--sans);font-size:13px;color:var(--dim2);font-weight:400;">panel</span></div>
    <div style="display:flex;align-items:center;gap:16px;">
      <div style="color:var(--dim2);font-size:13px;" id="refreshedAt"></div>
      <button class="headerBtn" onclick="openClients()">Clients</button>
    </div>
  </header>

  <div id="clientsModal">
    <div class="box">
      <span class="close" onclick="closeClients()">✕</span>
      <h3>Clients</h3>
      <div id="bizList"></div>
      <h3 style="margin-top:20px;">Add new client</h3>
      <input id="bizName" placeholder="Business name (e.g. Guido's Barbershop)">
      <div class="row2">
        <input id="bizSlug" placeholder="Short id (e.g. guidos)">
        <input id="bizPhoneId" placeholder="WhatsApp phone_number_id (optional)">
      </div>
      <div class="row2">
        <input id="bizIgId" placeholder="Instagram account_id (optional)">
      </div>
      <textarea id="bizFacts" placeholder="Hours, address, prices — whatever the bot should know. Plain text, in the business's own words."></textarea>
      <button class="save" onclick="addClient()">Add client</button>
      <div class="formErr" id="bizErr"></div>
    </div>
  </div>
  <div class="layout">
    <div id="list"></div>
    <div id="thread">
      <div id="thread-head" style="display:none;">
        <div>
          <div id="threadWho" style="font-weight:600;"></div>
          <div id="threadBiz" style="color:var(--dim2);font-size:12px;"></div>
        </div>
        <label class="toggle">
          Bot on <input type="checkbox" id="botToggle" onchange="toggleBot()">
        </label>
      </div>
      <div id="msgs"><div class="empty">Select a conversation</div></div>
    </div>
  </div>
</div>

<script>
let TOKEN = localStorage.getItem('ozzie_panel_token') || '';
let currentId = null;
let conversations = [];

async function doLogin(e) {
  e.preventDefault();
  const val = document.getElementById('tokenInput').value.trim();
  const r = await fetch('/api/panel/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token: val }) });
  const j = await r.json();
  if (j.ok) {
    TOKEN = val;
    localStorage.setItem('ozzie_panel_token', TOKEN);
    enterApp();
  } else {
    document.getElementById('loginErr').textContent = 'Wrong token';
  }
  return false;
}

function enterApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadConversations();
  setInterval(loadConversations, 15000);
}

async function loadConversations() {
  const r = await fetch('/api/panel/conversations?token=' + encodeURIComponent(TOKEN));
  if (r.status === 401) { localStorage.removeItem('ozzie_panel_token'); location.reload(); return; }
  conversations = await r.json();
  renderList();
  document.getElementById('refreshedAt').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

function renderList() {
  const list = document.getElementById('list');
  if (!conversations.length) { list.innerHTML = '<div class="listEmpty">No conversations yet — once a customer texts one of your WhatsApp numbers, it shows up here.</div>'; return; }
  list.innerHTML = conversations.map(c => {
    const label = c.customer_name || c.customer_phone;
    const initial = (label || '?').trim().charAt(0).toUpperCase();
    return `
    <div class="conv ${c.id === currentId ? 'active' : ''}" onclick="openConv('${c.id}')">
      <div class="avatar">${initial}</div>
      <div class="meta">
        <div class="who">${label}</div>
        <div class="biz">${c.business?.name || ''} · ${c.customer_phone}</div>
        ${c.bot_enabled === false ? '<div class="off">Bot paused — you have control</div>' : ''}
      </div>
    </div>`;
  }).join('');
}

async function openConv(id) {
  currentId = id;
  renderList();
  const c = conversations.find(x => x.id === id);
  document.getElementById('thread-head').style.display = 'flex';
  document.getElementById('threadWho').textContent = c.customer_name || c.customer_phone;
  document.getElementById('threadBiz').textContent = (c.business?.name || '') + ' · ' + c.customer_phone;
  document.getElementById('botToggle').checked = c.bot_enabled !== false;

  const r = await fetch('/api/panel/messages?conversation_id=' + id + '&token=' + encodeURIComponent(TOKEN));
  const msgs = await r.json();
  document.getElementById('msgs').innerHTML = msgs.map(m => `<div class="msg ${m.role}">${escapeHtml(m.content)}</div>`).join('') || '<div class="empty">No messages yet</div>';
}

async function toggleBot() {
  const enabled = document.getElementById('botToggle').checked;
  await fetch('/api/panel/toggle?token=' + encodeURIComponent(TOKEN), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ conversation_id: currentId, bot_enabled: enabled })
  });
  loadConversations();
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function openClients() {
  document.getElementById('clientsModal').style.display = 'flex';
  document.getElementById('bizErr').textContent = '';
  const r = await fetch('/api/panel/businesses?token=' + encodeURIComponent(TOKEN));
  const rows = await r.json();
  document.getElementById('bizList').innerHTML = rows.map(b => `
    <div class="biz-row"><b>${escapeHtml(b.name)}</b> (${escapeHtml(b.slug)})<br>
    <span class="num">${b.whatsapp_phone_number_id ? 'WhatsApp: ' + escapeHtml(b.whatsapp_phone_number_id) : ''}${b.whatsapp_phone_number_id && b.instagram_account_id ? ' · ' : ''}${b.instagram_account_id ? 'Instagram: ' + escapeHtml(b.instagram_account_id) : ''}</span><br>
    ${b.google_connected
      ? '<span class="num" style="color:var(--green);">📅 Google Calendar connected</span>'
      : `<a class="num" style="color:var(--green);text-decoration:underline;cursor:pointer;" href="/api/panel/google/connect?business_id=${encodeURIComponent(b.id)}&token=${encodeURIComponent(TOKEN)}" target="_blank">📅 Connect Google Calendar</a>`
    }</div>
  `).join('') || '<div class="empty">No clients yet</div>';
}

function closeClients() { document.getElementById('clientsModal').style.display = 'none'; }

async function addClient() {
  const name = document.getElementById('bizName').value.trim();
  const slug = document.getElementById('bizSlug').value.trim();
  const whatsapp_phone_number_id = document.getElementById('bizPhoneId').value.trim();
  const instagram_account_id = document.getElementById('bizIgId').value.trim();
  const facts = document.getElementById('bizFacts').value.trim();
  const errEl = document.getElementById('bizErr');
  if (!name || !slug || (!whatsapp_phone_number_id && !instagram_account_id)) {
    errEl.textContent = 'Name, short id and at least one of WhatsApp / Instagram id are required.';
    return;
  }
  const r = await fetch('/api/panel/businesses?token=' + encodeURIComponent(TOKEN), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, slug, whatsapp_phone_number_id, instagram_account_id, facts })
  });
  const j = await r.json();
  if (j.error) { errEl.textContent = j.error; return; }
  document.getElementById('bizName').value = '';
  document.getElementById('bizSlug').value = '';
  document.getElementById('bizPhoneId').value = '';
  document.getElementById('bizIgId').value = '';
  document.getElementById('bizFacts').value = '';
  openClients();
}

if (TOKEN) enterApp();
</script>
</body>
</html>
